[package]
name = "ytsrt"
version = "0.1.1"
edition = "2024"
description = "An asynchronous Rust library for extracting transcripts and captions from YouTube videos." 
license = "MIT"
keywords = ["youtube", "transcript", "captions", "async", "tokio"]
categories = ["multimedia", "api-bindings"]
repository = "https://github.com/aditya-gupta-dev/ytsrt"

[dependencies]
bytes = "1"
html-escape = "0.2"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
url = "2"
